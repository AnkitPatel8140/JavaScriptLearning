<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Asyn Js</h1>
    <button id="stop">stop</button>
</body>
<script>
    function change() {
        document.querySelector("h1").innerHTML = "setTimeout executed";
    }

    const changeTimeout = setTimeout(change, 2000);

    document.querySelector("#stop").addEventListener("click", ()=>{
        clearTimeout(changeTimeout);
        console.log("Time out stopped");
    })
    // setTimeout(function() {
    //     console.log("timeout");
    // }, 2000)
</script>
</html>
