<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Asyn Js</h1>
    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script>
    let intervalId;
    function startTime() {
        function printCurrentTime() {
            const body = document.querySelector("body");
            const newElement = document.createElement("div");
            newElement.innerHTML = Date.now().toLocaleString();
            body.appendChild(newElement);
        }
        intervalId = setInterval(printCurrentTime, 1000);
    }

    function stopTime() {
        clearInterval(intervalId);
    }

    document.querySelector("#start").addEventListener("click", startTime);
    document.querySelector("#stop").addEventListener("click", stopTime);
</script>
</html>
