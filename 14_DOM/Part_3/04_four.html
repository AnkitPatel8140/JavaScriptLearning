<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: white;" >
    <ul class="language">
        <li>Js</li>
    </ul>
</body>
<script>

    function addLanguage(langName) {        
        const listItem = document.createElement("li");
        listItem.innerHTML = langName;
        document.querySelector(".language").appendChild(listItem);
    }

    function addOptiLanguage(langName) {        
        const listItem = document.createElement("li");
        listItem.appendChild(document.createTextNode(langName));
        document.querySelector(".language").appendChild(listItem);
    }

    addLanguage("Python");
    addOptiLanguage("Java");

    // Edit
    const secondLang = document.querySelector("li:nth-child(2)");
    // secondLang.innerHTML = "new";

    const newLi = document.createElement("li");
    newLi.textContent = "new";
    secondLang.replaceWith(newLi);

    // Edit
    const firstLang = document.querySelector("li:first-child");
    firstLang.outerHTML = "<li>C++</li>";

    // Remove
    const lastChild = document.querySelector("li:last-child");
    lastChild.remove();


</script>
</html>
